<!-- Icons: Heroicons v2 outline (MIT, Tailwind Labs), inlined. -->
<div class="flex min-h-0 flex-1 flex-col">
  <main #main [attr.inert]="advancedEnabled() ? '' : null" class="min-h-0 flex-1 overflow-y-auto px-4 pb-6">
    <header class="mx-auto max-w-md py-4">
      <h1 class="text-xl font-bold tracking-tight text-gray-800">vCard</h1>
      <p class="text-sm text-gray-700">Dein QR-Code mit Kontaktdaten – als Hintergrundbild für den Sperrbildschirm.</p>
    </header>

    <form [formGroup]="form" class="mx-auto max-w-md divide-y divide-gray-200 overflow-hidden rounded-2xl border border-gray-200 bg-white">
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">Vorname*</span>
        <input autocomplete="given-name" class="field" formControlName="givenName" id="givenname" placeholder="Max" type="text">
      </label>
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">Nachname*</span>
        <input autocomplete="family-name" class="field" formControlName="familyName" id="name" placeholder="Mustermann" type="text">
      </label>
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">E-Mail*</span>
        <input autocomplete="email" class="field" formControlName="email" id="email" placeholder="max@example.com" type="email">
      </label>
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">Handy-Nr.*</span>
        <input autocomplete="mobile tel" class="field" formControlName="mobile" id="mobile" placeholder="+49 170 1234567" type="tel">
      </label>
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">Telefon</span>
        <input autocomplete="work tel" class="field" formControlName="phone" id="phone" placeholder="030 1234567" type="tel">
      </label>
      <label class="row">
        <span class="w-24 shrink-0 text-sm font-semibold">Adresse</span>
        <input autocomplete="street-address" class="field" formControlName="address" id="address" placeholder="Hauptstr. 1, 12345 Berlin" type="text">
      </label>
    </form>
    <p class="mx-auto mt-2 max-w-md px-4 text-xs text-gray-700" id="required-hint">* Pflichtfeld, für den QR-Code nötig</p>

    <section [class.hidden]="form.invalid" aria-label="Vorschau" class="not-has-[canvas]:hidden mx-auto mt-4 max-w-md rounded-2xl border border-gray-200 bg-white p-4 text-center">
      <!-- Rendered at 3x and shown at 200px, so it is sharp on phone displays. -->
      <div #canvas class="mx-auto size-[200px] [&_canvas]:size-full"></div>
      <p class="mt-3 text-sm text-gray-700">Scanne den Code, um deine Angaben zu prüfen.</p>
    </section>
  </main>

  <!-- Takes its own space above the bar, so it covers nothing; only over the wallpaper view it floats. -->
  @if (error(); as message) {
    <div #banner
         [class]="advancedEnabled() ? 'fixed inset-x-0 z-20 px-4' : 'px-4 pb-3'"
         role="alert"
         style="bottom: calc(env(safe-area-inset-bottom) + 5rem)">
      <div class="mx-auto flex max-w-md items-start gap-3 rounded-xl bg-red-600 p-3 text-white shadow-lg">
        <p class="flex-1 text-sm">{{ message }}</p>
        <button (click)="error.set(undefined)" aria-label="Meldung schließen" class="-m-1 p-1" type="button">
          <svg aria-hidden="true" class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  }

  <nav [attr.inert]="advancedEnabled() ? '' : null" aria-label="Aktionen" class="p-safe-bottom border-t border-gray-200 bg-white">
    <div class="mx-auto flex max-w-md">
      <button (click)="openBackgroundPicker()" [disabled]="form.invalid" aria-describedby="required-hint" class="action text-pink-600" type="button">
        <svg aria-hidden="true" class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Hintergrundbild
      </button>
      <button (click)="download()" [disabled]="form.invalid" aria-describedby="required-hint" class="action text-gray-700" type="button">
        <svg aria-hidden="true" class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        QR-Code speichern
      </button>
    </div>
  </nav>
  <input #backgroundInput (change)="onBackgroundSelected($event)" accept="image/*" class="hidden" type="file">
</div>

<!-- invisible instead of hidden: keeps its layout, so the preview area can be measured before it is shown. -->
<div [class.invisible]="!advancedEnabled()" class="p-safe-top fixed inset-0 z-10 flex flex-col bg-gray-100">
  <p class="px-4 py-3 text-center text-sm text-gray-700">QR-Code verschieben oder an den Ecken größer und kleiner ziehen</p>
  <div #previewArea class="flex min-h-0 flex-1 items-center justify-center overflow-hidden">
    <canvas #fullcanvas></canvas>
  </div>
  <nav aria-label="Hintergrundbild" class="p-safe-bottom border-t border-gray-200 bg-white">
    <div class="mx-auto flex max-w-md">
      <button (click)="closeAdvanced()" class="action text-gray-700" type="button">
        <svg aria-hidden="true" class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Zurück
      </button>
      <button (click)="downloadAdvanced()" class="action text-pink-600" type="button">
        <svg aria-hidden="true" class="size-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Speichern
      </button>
    </div>
  </nav>
</div>
